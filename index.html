<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
        name="description"
        content="Chicago CPS Map Explorer - Explore school attendance boundaries and geographic overlays."
    />

    <title>Chicago CPS Map Explorer</title>
</head>

<body>

    <div id="app">
        <header id="app-header">
            <div class="header-brand">
                <h1>Chicago CPS Map Explorer</h1>
                <p>Residential Property & School Information</p>
            </div>

            <div class="header-status">
                <span class="status-indicator"></span>
                Local Development
            </div>
        </header>

        <main id="app-main">

            <aside id="sidebar">

                <section class="search-section">
                    <h2>Property Search</h2>

                    <div class="search-container">
                        <input
                            type="text"
                            id="address-input"
                            placeholder="Enter a Chicago address..."
                        />

                        <button id="search-button">
                            Search
                        </button>
                    </div>
                </section>

                <section class="overlay-section">

                    <div class="section-heading">
                        <h2>Map Overlays</h2>
                        <button id="clear-overlays">
                            Clear all
                        </button>
                    </div>

                    <div id="overlay-container">
                        <!-- Overlay controls generated by JavaScript -->
                    </div>

                </section>

                <section class="property-section">
                    <h2>Property Information</h2>

                    <div id="property-information">
                        <p class="placeholder-text">
                            Select a location on the map to view CPS information.
                        </p>
                    </div>
                </section>

            </aside>

            <section id="map-container">

                <div id="map"></div>

            </section>

        </main>

        <footer id="app-footer">
            <span>Chicago CPS Map Explorer</span>
            <span>Personal Research Project</span>
        </footer>

    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
